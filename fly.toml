# 🚀 Fly.io Global Orchestration (OTT SOS)
# Regions: fra (Primary), iad, sin

app = "ott-sos-backend"
primary_region = "fra"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "get"
  path = "/health"
  port = 3000
  timeout = "5s"

[env]
  PRIMARY_REGION = "fra"
  PORT = "3000"
  NODE_ENV = "production"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
