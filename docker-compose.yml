version: "3.8"

services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ott-redis
    command: >
      redis-server
      --requirepass $${REDIS_PASSWORD}
      --appendonly yes
      --rename-command FLUSHALL ""
      --rename-command CONFIG ""
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    restart: always
