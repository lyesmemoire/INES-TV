version: '3.9'

services:
  # =====================
  # Next.js Application
  # =====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: INES TV-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - INES TV-network
    restart: unless-stopped
    command: npm run dev

  # =====================
  # Redis Cache
  # =====================
  redis:
    image: redis:7-alpine
    container_name: INES TV-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - INES TV-network
    restart: unless-stopped

  # =====================
  # Redis Commander (GUI)
  # =====================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: INES TV-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - INES TV-network
    restart: unless-stopped

volumes:
  redis-data:
    driver: local

networks:
  INES TV-network:
    driver: bridge
