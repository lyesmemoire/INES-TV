<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - StreamPerf</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 500px;
    }

    .icon {
      font-size: 120px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 16px;
      font-weight: 700;
    }

    p {
      font-size: 18px;
      color: #9ca3af;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    button {
      background: #ef4444;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #dc2626;
    }

    button:active {
      transform: scale(0.98);
    }

    .spinner {
      display: none;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 32px auto 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .checking .spinner {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. 
      Check your network and try again.
    </p>
    <button onclick="checkConnection()">Try Again</button>
    <div class="spinner"></div>
  </div>

  <script>
    async function checkConnection() {
      const container = document.querySelector('.container')
      container.classList.add('checking')

      try {
        const response = await fetch('/api/health', { 
          method: 'HEAD',
          cache: 'no-store'
        })

        if (response.ok) {
          window.location.href = '/'
        } else {
          showError()
        }
      } catch (error) {
        showError()
      }
    }

    function showError() {
      const container = document.querySelector('.container')
      container.classList.remove('checking')
      
      // Vibrate if supported
      if ('vibrate' in navigator) {
        navigator.vibrate(200)
      }
    }

    // Auto-retry when online
    window.addEventListener('online', () => {
      window.location.href = '/'
    })

    // Check connection status on load
    if (navigator.onLine) {
      checkConnection()
    }
  </script>
</body>
</html>
